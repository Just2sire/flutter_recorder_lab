name: recorder
description: "Whisper.cpp offline speech-to-text demo."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  whisper_cpp_flutter_plus: ^0.4.1
  path_provider: ^2.1.5
  file_picker: ^12.2.0
  ffmpeg_kit_flutter_new: ^4.6.2
  google_mlkit_document_scanner: ^0.6.1
  fast_paddle_ocr: ^0.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ocr_models/PP_OCRv5_mobile_det.ncnn.param
    - assets/ocr_models/PP_OCRv5_mobile_det.ncnn.bin
    - assets/ocr_models/PP_OCRv5_mobile_rec.ncnn.param
    - assets/ocr_models/PP_OCRv5_mobile_rec.ncnn.bin
